[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "procureops-agent"
version = "0.1.0"
description = "Harness-first, auditable multi-agent procurement workflow."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.12,<3",
  "pypdf>=6.0,<7",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procureops"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/procureops/agents/single.py" = ["RUF001"]
"src/procureops/evals/runner.py" = ["RUF001"]
"src/procureops/intake/service.py" = ["RUF001"]
