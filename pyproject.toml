[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "procureops-agent"
version = "0.5.0"
description = "Harness-first, auditable multi-agent procurement workflow."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.12,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
rag = [
  "numpy>=1.26,<3",
  "hnswlib>=0.8,<1",
  "faiss-cpu>=1.8,<2",
]
quality = [
  "deepeval>=4,<5",
  "langfuse>=4,<5",
  "opentelemetry-api>=1.39,<2",
]
infra = [
  "sqlalchemy>=2.0,<3",
  "asyncmy>=0.2,<1",
  "redis>=5,<7",
  "alembic>=1.16,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procureops"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/procureops/agents/single.py" = ["RUF001"]
"src/procureops/evals/runner.py" = ["RUF001"]
"src/procureops/evals/live_model.py" = ["RUF001"]
"src/procureops/intake/service.py" = ["RUF001"]
"scripts/generate_demo_pdf.py" = ["RUF001"]
