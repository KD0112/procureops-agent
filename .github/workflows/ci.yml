name: ProcureOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

      - name: Run test suite
        run: python -m pytest -q

      - name: Run deterministic agent benchmark
        run: python scripts/run_codeops_benchmark.py

      - name: Run CI repair benchmark
        run: python scripts/run_ci_repair_benchmark.py
